plugins {
    id 'com.android.application'
}

android {
    namespace 'de.delorean23.tube'
    compileSdk 35

    defaultConfig {
        applicationId 'de.delorean23.tube'
        minSdk 21
        targetSdk 35
        versionCode 5
        versionName '1.4'
    }

    // Zwei einzelne APKs: 32-bit (armeabi-v7a) und 64-bit (arm64-v8a)
    splits {
        abi {
            enable true
            reset()
            include 'armeabi-v7a', 'arm64-v8a'
            universalApk false
        }
    }

    // Fester Schlüssel: der SHA-1 muss immer gleich bleiben, sonst klappt der Google-Login nicht
    signingConfigs {
        fest {
            storeFile file('signing.jks')
            storePassword 'delorean23'
            keyAlias 'delorean23'
            keyPassword 'delorean23'
        }
    }

    buildTypes {
        release {
            minifyEnabled false
            signingConfig signingConfigs.fest
        }
        debug {
            signingConfig signingConfigs.fest
        }
    }

    compileOptions {
        coreLibraryDesugaringEnabled true
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }

    lint {
        checkReleaseBuilds false
        abortOnError false
    }

    packaging {
        resources {
            excludes += [
                'META-INF/DEPENDENCIES',
                'META-INF/LICENSE*',
                'META-INF/NOTICE*',
                'META-INF/*.md',
                'META-INF/INDEX.LIST',
                'META-INF/versions/9/OSGI-INF/MANIFEST.MF',
                'META-INF/*.kotlin_module'
            ]
        }
    }
}

dependencies {
    coreLibraryDesugaring 'com.android.tools:desugar_jdk_libs_nio:2.1.5'

    implementation platform('org.jetbrains.kotlin:kotlin-bom:1.8.22')
    implementation 'androidx.appcompat:appcompat:1.7.0'
    implementation 'androidx.recyclerview:recyclerview:1.3.2'
    implementation 'androidx.swiperefreshlayout:swiperefreshlayout:1.1.0'

    // YouTube-Daten ohne Werbung (gleiche Version wie die NewPipe-App)
    implementation 'com.github.TeamNewPipe:NewPipeExtractor:6cb36e982311dc1c529997bc329013afe75f37d1'
    implementation 'com.squareup.okhttp3:okhttp:4.12.0'

    // Player mit Hintergrund-Wiedergabe
    implementation 'androidx.media3:media3-exoplayer:1.5.1'
    implementation 'androidx.media3:media3-exoplayer-hls:1.5.1'
    implementation 'androidx.media3:media3-ui:1.5.1'
    implementation 'androidx.media3:media3-session:1.5.1'

    // Google-Konto (Kontoauswahl "Mit Google anmelden")
    implementation 'com.google.android.gms:play-services-auth:21.2.0'

    // Chromecast
    implementation 'androidx.mediarouter:mediarouter:1.7.0'
    implementation 'com.google.android.gms:play-services-cast-framework:21.5.0'

    // Vorschaubilder
    implementation 'com.github.bumptech.glide:glide:4.16.0'
}
