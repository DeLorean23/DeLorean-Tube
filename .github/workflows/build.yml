name: APK bauen

on:
  push:
    paths-ignore:
      - 'youtube/**'
      - '.github/workflows/youtube.yml'
      - 'cloud/**'
      - '.github/workflows/cloud.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      # Android-SDK ist auf ubuntu-latest vorinstalliert
      - name: SDK-Lizenzen bestätigen
        run: yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses > /dev/null || true

      - name: APK bauen (32-bit, armeabi-v7a)
        run: |
          chmod +x gradlew
          ./gradlew :app:assembleRelease --no-daemon

      - name: APK umbenennen
        run: cp app/build/outputs/apk/release/app-release.apk AdBlockBrowser-32bit.apk

      - uses: actions/upload-artifact@v4
        with:
          name: AdBlockBrowser-32bit
          path: AdBlockBrowser-32bit.apk

      # Fertige APK als Release veröffentlichen (direkt am Handy herunterladbar)
      - uses: softprops/action-gh-release@v2
        if: github.ref == 'refs/heads/main'
        with:
          tag_name: build-${{ github.run_number }}
          name: AdBlock Browser Build ${{ github.run_number }}
          body: 32-bit APK (armeabi-v7a). Created by DeLorean23
          files: AdBlockBrowser-32bit.apk
          make_latest: true
